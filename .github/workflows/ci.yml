name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar toolchain (LLVM 18 do Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 python3
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/lld-link-18 /usr/local/bin/lld-link
          for t in objcopy objdump nm readelf; do sudo ln -sf /usr/bin/llvm-$t-18 /usr/local/bin/llvm-$t; done
      - name: Registrar versões do toolchain
        run: |
          clang --version | tee toolchain.txt
          ld.lld --version | tee -a toolchain.txt
      - name: Verificar checksums das fontes
        run: sha256sum -c SOURCE_SHA256SUMS --quiet
      - name: Regressão completa
        run: make check
      - name: Perfis live e controlador UEFI
        run: |
          make qemu-e1000-sandbox
          make current-recovery-live
          make trusted-boot-controller
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: peregrinus-elfs
          path: |
            build/peregrinus.elf
            build-qemu-e1000/peregrinus.elf
            build-current-recovery-live/peregrinus.elf
            toolchain.txt
