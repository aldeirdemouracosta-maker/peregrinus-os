name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar toolchain (LLVM 18 do Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 python3
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/lld-link-18 /usr/local/bin/lld-link
          for t in objcopy objdump nm readelf; do sudo ln -sf /usr/bin/llvm-$t-18 /usr/local/bin/llvm-$t; done
      - name: Registrar versões do toolchain
        run: |
          clang --version | tee toolchain.txt
          ld.lld --version | tee -a toolchain.txt
      - name: Regressão completa
        run: make check
      - name: Perfis live e controlador UEFI
        run: |
          make qemu-e1000-sandbox
          make current-recovery-live
          make trusted-boot-controller
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: peregrinus-elfs
          path: |
            build/peregrinus.elf
            build-qemu-e1000/peregrinus.elf
            build-current-recovery-live/peregrinus.elf
            toolchain.txt

  qemu-boot:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [safe, disk, e1000, journal, commit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Instalar toolchain, QEMU, OVMF e dependências do Limine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 python3 \
            qemu-system-x86 ovmf xorriso nasm mtools make
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          for t in objcopy objdump nm readelf; do sudo ln -sf /usr/bin/llvm-$t-18 /usr/local/bin/llvm-$t; done
      - name: Habilitar KVM (se disponível no runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "KVM indisponível; usando TCG"
      - name: Limine fixado (tarball verificado por SHA-256)
        run: ./scripts/fetch-limine.sh
      - name: Boot no QEMU (${{ matrix.profile }})
        run: ./scripts/qemu-boot-test.sh ${{ matrix.profile }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serial-${{ matrix.profile }}
          path: build-boot-test/*-serial.txt
