# Configuração do llama-server para o Peregrinus OS (lida pelo serviço systemd).
# Depois de mudar: sudo systemctl restart llama-server
#
# Modelo GGUF. Com a P100 de 16 GB, um 14B em Q4_K_M (~9 GB) cabe inteiro na GPU.
MODELO=/opt/peregrinus-ia/modelos/modelo.gguf
# Camadas na GPU: 99 = todas. Para modelos maiores que a VRAM (ex.: 32B), reduza (ex.: 40) e o
# resto roda na CPU/RAM (32 GB de RAM permitem, porém fica bem mais lento).
CAMADAS_GPU=99
# Contexto em tokens (memória do KV cache cresce com ele).
CONTEXTO=8192
